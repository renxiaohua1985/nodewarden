name: Deploy NodeWarden to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy with Wrangler
        run: |
          # 1. 强制在 Cloudflare 后台为该项目创建/锁定 JWT_SECRET 机密变量
          npx wrangler secret put JWT_SECRET --text "${{ secrets.JWT_SECRET }}"
          
          # 2. 执行项目原有的 KV 模式部署指令
          npm run deploy:kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
